<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <title>Student</title>
</head>
<body>

<form action="#" th:action="@{/processStudentForm}" th:object="${student}" method="post">

    First Name: <input type="text" name="firstName" th:field="*{firstName}"/>
    <br><br>
    Last Name: <input type="text" name="lastName" th:field="*{lastName}"/>
    <br><br>
    Country:
    <select th:field="*{country}">

        <option th:each="country : ${countries}" th:value="${country}" th:text="${country}"/>
        <!--        <option th:value="Brazil" th:text="Brazil"></option>-->
        <!--        <option th:value="France" th:text="France"></option>-->
        <!--        <option th:value="Ukraine" th:text="Ukraine"></option>-->
        <!--        <option th:value="Russia" th:text="Russia"></option>-->
    </select>
    <br><br>

    Favourite Programming Language:
    <!--    <input type="radio"   th:field="*{favoriteLanguage}"-->
    <!--                          th:each="tempLang: ${languages}"-->
    <!--                          th:value="${tempLang}"-->
    <!--                          th:text="${tempLang}"/>-->
    <span th:each="tempLang : ${languages}">
        <label>
            <input type="radio"
                   th:field="*{favoriteLanguage}"
                   th:value="${tempLang}"/>
            <span th:text="${tempLang}"></span>
        </label>
    </span>
    <!--    <input type="radio" th:field="*{favoriteLanguage}" value="Java">Java</input>-->
    <!--    <input type="radio" th:field="*{favoriteLanguage}" value="Go">Go</input>-->
    <!--    <input type="radio" th:field="*{favoriteLanguage}" value="Python">Python</input>-->

    <br><br>
    Favorite OS:
    <span th:each="temp : ${systems}">
        <label>
            <input type="checkbox"
                   th:field="*{favoriteSystems}"
                   th:value="${temp}"/>
                   <span th:text="${temp}"/>
        </label>
    </span>

    <!--    <label> <input type="checkbox" th:field="*{favoriteSystems}" th:value="Linux">Linux</input></label>-->
    <!--    <label> <input type="checkbox" th:field="*{favoriteSystems}" th:value="Windows">Windows</input></label>-->
    <!--    <label><input type="checkbox" th:field="*{favoriteSystems}" th:value="MacOS">MacOS</input></label>-->

    <br><br>
    <input type="submit" value="Submit"/>
</form>

</body>
</html>

<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Student Confirmation</title>
</head>
<body>
<h3>Student Confirmation</h3>
<br><br>
First Name: <span th:text="${student.firstName}"></span>
<br><br>
Last Name: <span th:text="${student.lastName}"></span>
<br><br>
Country: <span th:text="${student.country}"></span>
<br><br>
Favourite Programming Language: <span th:text="${student.favoriteLanguage}"></span>
<br><br>
Favorite OS:

<ul>
    <li th:each="tempSystem : ${student.favoriteSystems}" th:value="${tempSystem}" th:text="${tempSystem}"></li>
</ul>
<!--<span th:text="${student.favoriteSystems}"></span>-->
</body>
</html>
